name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Start API and database
      working-directory: app-under-test/api
      run: docker compose up -d --build

    - name: Wait for API
      run: |
        for i in $(seq 1 60); do
          curl -fs http://localhost:3100/api/health-check && exit 0
          sleep 3
        done
        docker compose -f app-under-test/api/docker-compose.yml logs
        exit 1

    - name: Start frontend
      working-directory: app-under-test/web
      run: |
        cp .env.example .env.local
        npm ci
        nohup npm run serve > ../../vite.log 2>&1 &

    - name: Wait for frontend
      run: |
        for i in $(seq 1 30); do
          curl -fs http://localhost:8080 > /dev/null && exit 0
          sleep 2
        done
        cat vite.log
        exit 1

    - name: Install test dependencies
      working-directory: ui-tests
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ui-tests
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      working-directory: ui-tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: ui-tests/playwright-report/
        retention-days: 30

    - name: Stop API
      if: always()
      working-directory: app-under-test/api
      run: docker compose down -v
